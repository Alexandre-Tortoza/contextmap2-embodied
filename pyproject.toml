[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "contextmap2-embodied"
version = "0.1.0.dev0"
description = "Embodied downstream validation for ContextMap2 artifacts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Alexandre Tortoza" }
]
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
contextmap = [
  "contextmap @ git+https://github.com/Alexandre-Tortoza/contextmap2.git@32585fdacaa98a80fcac0fa5af94bd871bdfeae3",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
contextmap2-embodied = "contextmap2_embodied.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextmap2_embodied"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contextmap2_embodied"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
